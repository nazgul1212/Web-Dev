<div class="card">
    <img [src]="product().image">
    <h3>{{ product().name }}</h3>
    <div class="info">
      <span class="price">{{ product().price }} ₸</span>
      <span class="likes" (click)="like()">❤ {{ product().likes }}</span>
    </div>
    <div class="actions">
      <button (click)="share()" class="share-btn">Share</button>
      <button (click)="onDelete()" class="del-btn">Remove</button>
    </div>
  </div>
